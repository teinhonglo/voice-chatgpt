services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1::11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "${LOCAL_LLM_CONTEXT_LENGTH:-4096}"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LOCAL_GPU_ID:-0}"]
              capabilities: [gpu]

  minicpmo:
    image: vllm/vllm-omni:v0.26.0post1.20260811
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1::8099"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    entrypoint: ["vllm-omni"]
    command:
      - serve
      - "${LOCAL_DUPLEX_MODEL:-openbmb/MiniCPM-o-4_5-GPTQ}"
      - --omni
      - --deploy-config
      - vllm_omni/deploy/minicpmo_4_5_duplex.yaml
      - --stage-overrides
      - '{"0":{"gpu_memory_utilization":0.38,"max_num_seqs":1},"1":{"gpu_memory_utilization":0.08,"max_num_seqs":1,"kv_cache_memory_bytes":1073741824},"2":{"gpu_memory_utilization":0.08,"max_num_seqs":1}}'
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "8099"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LOCAL_DUPLEX_GPU_ID:-0}"]
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  ollama_data:
  huggingface_cache:
  qdrant_data:
