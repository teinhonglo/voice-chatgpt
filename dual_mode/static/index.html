<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>語音聊天</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <h1 id="app-title">語音聊天</h1>
        </div>
        <div class="mode-switch hidden" id="mode-switch" role="group" aria-label="語音模式">
          <button class="mode-button active" data-mode="pipeline" type="button">
            <span>Pipeline</span><small>OpenAI</small>
          </button>
          <button class="mode-button" data-mode="realtime" type="button">
            <span>Full Duplex</span><small>OpenAI</small>
          </button>
          <button class="mode-button" data-mode="local-pipeline" type="button">
            <span>Pipeline</span><small>Local LLM + RAG</small>
          </button>
          <button class="mode-button" data-mode="local-realtime" type="button">
            <span>Full Duplex</span><small>Local LLM + RAG</small>
          </button>
        </div>
      </header>

      <section class="settings-card" aria-labelledby="settings-heading">
        <div class="section-heading">
          <div>
            <p class="step-label">01 / SETTINGS</p>
            <h2 id="settings-heading">對話設定</h2>
          </div>
          <span class="saved-indicator" id="saved-indicator">自動儲存</span>
        </div>

        <label class="field field-wide">
          <span>System prompt</span>
          <textarea id="system-prompt" rows="4">You are an upbeat, encouraging tutor who helps students understand concepts by explaining ideas and asking students questions. Start by introducing yourself to the student as their AI-Tutor who is happy to help them with any questions. Only ask one question at a time. First, ask them what they would like to learn about. Wait for the response. Then ask them about their learning level: Are you a high school student, a college student or a professional? Wait for their response. Then ask them what they know already about the topic they have chosen. Wait for a response. Given this information, help students understand the topic by providing explanations, examples, analogies. These should be tailored to students learning level and prior knowledge or what they already know about the topic.Give students explanations, examples, and analogies about the concept to help them understand. You should guide students in an open-ended way. Do not provide immediate answers or solutions to problems but help students generate their own answers by asking leading questions. Ask students to explain their thinking. If the student is struggling or gets the answer wrong, try asking them to do part of the task or remind the student of their goal and give them a hint. If students improve, then praise them and show excitement. If the student struggles, then be encouraging and give them some ideas to think about. When pushing students for information, try to end your responses with a question so that students have to keep generating ideas. Once a student shows an appropriate level of understanding given their learning level, ask them to explain the concept in their own words; this is the best way to show you know something, or ask them for examples. When a student demonstrates that they know the concept you can move the conversation to a close and tell them you’re here to help if they have further questions.</textarea>
        </label>

        <label class="field field-wide">
          <span>LLM</span>
          <select id="llm-model" disabled>
            <option>正在載入可用模型…</option>
          </select>
          <small class="model-help" id="model-help">模型清單由後端安全載入，API key 不會傳到瀏覽器。</small>
        </label>

        <div class="settings-grid">
          <label class="field">
            <span>Language A · 我說</span>
            <select id="language-a"></select>
          </label>
          <div class="language-arrow" aria-hidden="true">→</div>
          <label class="field">
            <span>Language B · AI 回答</span>
            <select id="language-b"></select>
          </label>
          <label class="field voice-field">
            <span>Voice</span>
            <select id="voice"></select>
          </label>
        </div>
      </section>

      <section class="knowledge-card" aria-labelledby="knowledge-heading">
        <div class="section-heading">
          <div>
            <p class="step-label">02 / KNOWLEDGE</p>
            <h2 id="knowledge-heading">RAG 知識庫</h2>
          </div>
          <span class="knowledge-state" id="rag-status">OpenAI · 尚未上傳檔案</span>
        </div>

        <div class="upload-row">
          <label class="file-picker" for="rag-files">
            <span>選擇知識檔案</span>
            <input
              id="rag-files"
              type="file"
              multiple
              accept=".c,.cpp,.cs,.css,.doc,.docx,.go,.html,.java,.js,.json,.md,.pdf,.php,.pptx,.py,.rb,.sh,.tex,.ts,.txt"
            />
          </label>
          <button class="primary-action upload-action" id="rag-upload-button" type="button">
            上傳並建立索引
          </button>
          <button class="secondary-action" id="rag-delete-button" type="button" disabled>
            清除知識庫
          </button>
        </div>
        <div class="knowledge-files hidden" id="rag-file-list" aria-live="polite"></div>
        <p class="field-help" id="rag-help">
          目前為 OpenAI 知識庫；完成索引後，兩個 OpenAI 模式會共用相同檔案。
        </p>
      </section>

      <section class="conversation-card" aria-labelledby="conversation-heading">
        <div class="section-heading conversation-heading">
          <div>
            <p class="step-label">03 / CONVERSATION</p>
            <h2 id="conversation-heading">開始對話</h2>
          </div>
          <div class="connection-state" id="connection-state">
            <span class="state-dot"></span>
            <span id="status-text">Pipeline 待命</span>
          </div>
        </div>

        <div class="mode-description" id="mode-description">
          錄一段話後，依序完成語音辨識、文字回覆與語音合成。適合保留清楚的逐輪紀錄。
        </div>

        <div class="chat-log" id="chat-log" aria-live="polite">
          <div class="empty-state" id="empty-state">
            <span class="wave-icon">⌁</span>
            <p>你的對話會顯示在這裡</p>
          </div>
        </div>

        <div class="live-caption hidden" id="live-caption" aria-live="polite"></div>

        <div class="controls" id="pipeline-controls">
          <button class="primary-action" id="record-button" type="button">
            <span class="action-icon" aria-hidden="true">●</span>
            <span id="record-button-label">開始錄音</span>
          </button>
          <button class="secondary-action" id="clear-button" type="button">清除對話</button>
        </div>

        <div class="controls hidden" id="realtime-controls">
          <button class="primary-action" id="call-button" type="button">
            <span class="action-icon" aria-hidden="true">◉</span>
            <span id="call-button-label">開始 Full Duplex</span>
          </button>
          <button class="secondary-action" id="mute-button" type="button" disabled>靜音</button>
          <button class="secondary-action" id="clear-realtime-button" type="button">清除對話</button>
        </div>

        <audio id="remote-audio" autoplay></audio>
        <audio id="pipeline-audio" autoplay></audio>
      </section>

      <footer>
        <p id="privacy-note">語音由 AI 生成。OpenAI 模式會將上傳檔案交由 OpenAI 建立檢索索引；請勿上傳未經授權的機密資料。</p>
      </footer>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
